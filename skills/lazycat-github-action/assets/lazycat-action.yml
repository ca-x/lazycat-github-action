version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  sync_homepage: true
  sync_license: true
  strategy: pull
  allow_downgrade: false
  version_source:
    type: image
    image: web

# To publish LPKs to B/C, set caller workflow with.release-repository and
# map A's GH_RELEASE_TOKEN Secret; github_repository below is only for notes.
# One source changelog is resolved; stores receive plain text by default.
release:
  use_github_release_notes: true
  # plain (default) removes Markdown at store submission; markdown preserves it.
  store_changelog_format: plain
  # github_repository: owner/repo
  changelog_template: "{{if .ReleaseNotes}}{{.ReleaseNotes}}{{else}}Release {{.Version}}{{end}}"

images:
  - id: web
    target: service
    service: web
    source: ghcr.io/acme/example-web
    channel: stable
    delivery:
      mode: lazycat

stores:
  official:
    enabled: false
    continue_if_newer_version: true
    skip_if_version_exists: false
    retry:
      enabled: true
  private:
    enabled: false
    skip_if_version_exists: false
